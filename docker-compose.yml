services:

  postgres:
    image: postgres:16
    container_name: netflix_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "${PG_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # El CSV queda visible para el servidor en /data (lo lee COPY en 02_carga_datos.sql)
      - ./data:/data:ro
      - ./sql:/scripts:ro
      - ./dump:/dump

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: netflix_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: cristian.diaz@campuslands.com
      PGADMIN_DEFAULT_PASSWORD: campus123

    ports:
      - "${PGADMIN_PORT:-5050}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
